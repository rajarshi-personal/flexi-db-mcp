[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portable-database-mcp"
version = "0.1.0"
description = "Cloud-independent SQL and MongoDB MCP server"
authors = [{name = "Rajarshi Ray", email = "rajarshir@gmail.com"}]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["mcp>=1.20,<2", "sqlalchemy>=2.0,<3", "sqlglot>=26,<31", "pydantic>=2.10,<3", "PyYAML>=6,<7", "httpx>=0.27,<1"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
mysql = ["pymysql>=1.1,<2"]
oracle = ["oracledb>=2.5,<4"]
sqlserver = ["pyodbc>=5.2,<6"]
mongo = ["pymongo>=4.11,<5"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
dbmcp = "dbmcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dbmcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

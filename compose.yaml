# Disposable local development databases only. Do not use these credentials in production.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dbmcp
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbmcp -d app"]
      interval: 5s
      timeout: 5s
      retries: 15
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: dbmcp
      MONGO_INITDB_ROOT_PASSWORD: local-dev-only
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 15
